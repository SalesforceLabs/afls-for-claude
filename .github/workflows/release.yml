name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # macOS runner so electron-builder can produce the signed-capable mac
    # installers (.dmg/.zip) alongside the release.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Package desktop app (macOS)
        # Builds the MCP server + Electron bundles, then electron-builder emits
        # the mac dmg/zip into release/ and rebuilds native modules for Electron.
        run: npm run electron:pack
        env:
          # No signing certs in CI — produce an unsigned build instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
