# AFLS Intelligent Content Configuration Validation Rules
# ========================================================
# Rules to validate Intelligent Content (CLM) configuration including
# presentations, pages, territory distribution, presentation settings,
# tracking, and mobile cache.
#
# Verified object names:
#   - Presentation (standard)
#   - PresentationPage (standard)
#   - PresentationShare (standard - territory distribution via sharing records)
#   - PresentationPageContent (standard)
#   - PresentationPageProduct (standard)
#   - LifeSciPresEvent (standard - tracking)
#   - Topic (standard - categories)
#   - ProviderAcctTerritoryInfo (standard)
#   - LifeSciMobileMetadataRecord (standard)

schema_version: "1.0"
category_name: "Intelligent Content Configuration"
description: |
  Validation rules for AFLS Intelligent Content (CLM) configuration.
  Covers presentations, presentation pages, territory distribution,
  product assignments, presentation settings, tracking, and mobile cache requirements.

rules:
  # ===========================================================================
  # SECTION 1: Core Presentation Configuration
  # ===========================================================================

  - id: content-001
    name: Presentations exist in the system
    description: |
      Verifies that at least one Presentation record exists in the org.
      Presentations are the foundation of Intelligent Content (CLM) and are
      required for reps to deliver compliant marketing content to HCPs.
      Without presentations, the Content Library will be empty and reps cannot
      access approved marketing materials during visits.
    category: configuration
    severity: error
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM Presentation
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Status, IsActive, IsCustomPresentation, CreatedDate
        FROM Presentation
        ORDER BY CreatedDate DESC
        LIMIT 10
    symptoms:
      - "Content Library is empty"
      - "No presentations available to reps"
      - "Cannot access Intelligent Content features"
      - "Presentation tab shows no records"
    resolution:
      steps:
        - "Navigate to Admin Console > Intelligent Content > Presentations tab"
        - "Click 'Upload New Pages' to upload PDF or HTML (ZIP) presentations"
        - "Configure presentation metadata (name, products, topics, activation dates)"
        - "Assign presentations to territories via Territory Distribution"
        - "Activate presentations to make them visible to end users"
      ui_path: "Admin Console > Intelligent Content > Presentations"
    tags: [content, configuration, presentation]

  - id: content-002
    name: Active presentations exist
    description: |
      Verifies that at least one active Presentation exists. Presentations must
      be activated before they become visible to end users. Inactive presentations
      remain in the system but are not accessible in the Content Library.
      This check ensures that reps have access to at least some approved content.
    category: configuration
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM Presentation
        WHERE IsActive = true
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Status, IsActive, ActivationDate, DeactivationDate
        FROM Presentation
        WHERE IsActive = false
        ORDER BY CreatedDate DESC
        LIMIT 10
    symptoms:
      - "Content Library appears empty to reps"
      - "Presentations configured but not visible"
      - "Reps cannot access uploaded presentations"
    resolution:
      steps:
        - "Navigate to Admin Console > Intelligent Content > Presentations tab"
        - "Identify presentations that should be active"
        - "Click 'Activate' on each presentation"
        - "Verify ActivationDate is not in the future"
        - "Verify DeactivationDate is null or in the future"
        - "Ensure presentations are distributed to territories"
      ui_path: "Admin Console > Intelligent Content > Presentations"
    tags: [content, configuration, activation]

  # ===========================================================================
  # SECTION 2: Presentation Pages
  # ===========================================================================

  - id: content-003
    name: Presentation pages exist
    description: |
      Checks whether PresentationPage records exist. Every presentation must
      have at least one page. Pages contain the actual content (HTML or PDF)
      and metadata (product assignments, mandatory flags, page order).
      Without pages, presentations cannot be displayed to HCPs.
    category: configuration
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM PresentationPage
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, PresentationId, Presentation.Name, PageOrder, IsMandatory
        FROM PresentationPage
        ORDER BY PresentationId, PageOrder
        LIMIT 10
    symptoms:
      - "Presentations configured but cannot be opened"
      - "Presentation player shows blank screen"
      - "Content Library shows presentations with no pages"
    resolution:
      steps:
        - "Navigate to Admin Console > Intelligent Content > Presentations tab"
        - "Click 'Upload New Pages' to add pages to presentations"
        - "Select ZIP files (HTML) or PDF files"
        - "System validates file structure and uploads content"
        - "Configure page metadata (products, mandatory flags, page order)"
      ui_path: "Admin Console > Intelligent Content > Presentations"
    tags: [content, configuration, pages]

  - id: content-004
    name: Mandatory pages configured
    description: |
      Checks whether any mandatory pages are configured. Mandatory pages
      (safety disclaimers, legal statements, key brand messages) must be
      presented before reps can continue to another presentation or save a visit.
      This ensures compliance with regulatory requirements and company policies.
      If no mandatory pages exist, verify this is intentional.
    category: configuration
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM PresentationPage
        WHERE IsMandatory = true
      expect: "count > 0"
    symptoms:
      - "Reps can skip important compliance pages"
      - "Legal disclaimers not enforced"
      - "No mandatory pages configured"
    resolution:
      steps:
        - "Navigate to Admin Console > Intelligent Content > Presentations tab"
        - "Click 'Edit' on presentations that require mandatory pages"
        - "Mark safety disclaimers, legal statements, or key brand messages as mandatory"
        - "Verify IsMandatory flag is set: SELECT Id, Name, IsMandatory FROM PresentationPage"
        - "Test on mobile to ensure mandatory page enforcement works"
      ui_path: "Admin Console > Intelligent Content > Presentations > Edit"
    tags: [content, configuration, compliance, mandatory]

  # ===========================================================================
  # SECTION 3: Territory Distribution
  # ===========================================================================

  - id: content-005
    name: Presentation territory distribution exists
    description: |
      Verifies that presentations are distributed to at least one territory.
      Territory distribution uses PresentationShare records that link Presentation
      records to territory Group IDs (Type = Territory or TerritoryAndSubordinates).
      Without distribution, presentations will not appear in the Content Library
      even if they are active.
    category: configuration
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM PresentationShare
        WHERE RowCause IN ('Manual', 'LSC4CEAutoShare')
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, ParentId, UserOrGroupId, RowCause, AccessLevel
        FROM PresentationShare
        WHERE RowCause IN ('Manual', 'LSC4CEAutoShare')
        ORDER BY ParentId
        LIMIT 10
    symptoms:
      - "Active presentations not visible in Content Library"
      - "Reps cannot access uploaded presentations"
      - "Territory-based content filtering not working"
    resolution:
      steps:
        - "Navigate to Admin Console > Intelligent Content > Presentations tab"
        - "Click 'Edit' on each presentation"
        - "Scroll to Territory Distribution section"
        - "Select territories (parent selection auto-selects children)"
        - "Save and verify distribution records: SELECT Id, ParentId, UserOrGroupId FROM PresentationShare WHERE RowCause IN ('Manual', 'LSC4CEAutoShare')"
      ui_path: "Admin Console > Intelligent Content > Presentations > Edit > Territory Distribution"
    tags: [content, configuration, territory, distribution]

  # ===========================================================================
  # SECTION 4: Product Assignments
  # ===========================================================================

  - id: content-007
    name: Products linked to presentation pages
    description: |
      Checks whether any products or product messages are assigned to presentation
      pages. Product assignments enable product-level tracking (which products
      were detailed during visits) and support features like recommended/targeted
      presentations. If no product assignments exist, product tracking will not work.
    category: configuration
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM PresentationPageProduct
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, PresentationPageId, PresentationPage.Name, ProductId
        FROM PresentationPageProduct
        ORDER BY PresentationPageId
        LIMIT 10
    symptoms:
      - "Product tracking not working"
      - "Cannot report on products detailed during visits"
      - "Recommended presentations not appearing"
    resolution:
      steps:
        - "Navigate to Admin Console > Intelligent Content > Presentations tab"
        - "Click 'Edit' on presentations that should have product assignments"
        - "Assign products or product messages to individual pages"
        - "Verify assignments: SELECT PresentationPage.Name, ProductId FROM PresentationPageProduct"
      ui_path: "Admin Console > Intelligent Content > Presentations > Edit > Configure Pages"
    tags: [content, configuration, products]

  # ===========================================================================
  # SECTION 5: Presentation Usage Tracking
  # ===========================================================================

  - id: content-008
    name: Presentation tracking configured
    description: |
      Checks whether presentation usage tracking records (LifeSciPresEvent) exist.
      These records capture which presentations were shown during visits, including
      time spent, pages viewed, products detailed, and HCP feedback. If no tracking
      records exist, either presentations have not been used yet, or tracking is
      disabled in Presentation Settings. This check helps verify that tracking
      is working correctly after presentations have been deployed.
    category: tracking
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciPresEvent
      expect: "count >= 0"
      error_detail_query: >
        SELECT Id, PresentationId, Presentation.Name, VisitId, Duration, CreatedDate
        FROM LifeSciPresEvent
        ORDER BY CreatedDate DESC
        LIMIT 10
    symptoms:
      - "Presentation usage not being tracked"
      - "No metrics on content engagement"
      - "Reporting shows no presentation data"
    resolution:
      steps:
        - "If no tracking records exist and presentations have been used, check Presentation Settings"
        - "Navigate to Admin Console > Intelligent Content > Presentation Settings"
        - "Verify 'Track Presentations' is enabled"
        - "Verify 'Track Pages' is enabled for page-level tracking"
        - "Verify 'Track Products and Messages' is enabled for product-level tracking"
        - "Verify 'Track HCP Feedback' is enabled for feedback capture"
        - "Have reps present content in Play Mode (not Preview Mode) to generate tracking records"
      ui_path: "Admin Console > Intelligent Content > Presentation Settings"
    tags: [content, tracking, analytics]

  # ===========================================================================
  # SECTION 6: Recommended/Targeted Presentations
  # ===========================================================================

  - id: content-009
    name: Recommended or targeted presentations configured
    description: |
      Checks whether recommended or targeted presentations are configured in
      ProviderAcctTerritoryInfo records. Recommended presentations provide
      personalized content suggestions based on HCP profile and engagement history.
      Targeted presentations enforce compliance by restricting which content is
      visible for specific accounts. If neither exist, personalization and
      targeting features are not being used.
    category: configuration
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM ProviderAcctTerritoryInfo
        WHERE RecommendedPresentations != null OR TargetedPresentations != null
      expect: "count >= 0"
      error_detail_query: >
        SELECT Id, AccountId, Account.Name, Territory2.Name, RecommendedPresentations, TargetedPresentations
        FROM ProviderAcctTerritoryInfo
        WHERE RecommendedPresentations != null OR TargetedPresentations != null
        LIMIT 10
    symptoms:
      - "Recommended presentations not appearing"
      - "Targeted presentations not enforcing compliance"
      - "Personalization features not working"
    resolution:
      steps:
        - "Populate ProviderAcctTerritoryInfo.RecommendedPresentations with JSON format: {\"presentationIds\": [\"id1\", \"id2\"], \"order\": [\"id1\", \"id2\"]}"
        - "Populate ProviderAcctTerritoryInfo.TargetedPresentations with list of presentation IDs"
        - "Load data via API, Data Loader, or manual entry"
        - "Admin Console > Intelligent Content > Presentation Settings"
        - "Enable 'Show Next Best Message' for recommended presentations"
        - "Configure 'Targeted Presentations - Warn Context' or 'Targeted Presentations - Restriction Context'"
      ui_path: "Admin Console > Intelligent Content > Presentation Settings"
    tags: [content, configuration, personalization, targeting]

  # ===========================================================================
  # SECTION 7: Content Categories (Topics)
  # ===========================================================================

  - id: content-010
    name: Topics configured for organizing presentations
    description: |
      Checks whether Topics exist for organizing presentations in the Content
      Library. Topics allow reps to filter and find content by category
      (therapeutic area, product line, campaign, etc.). Without topics, the
      Content Library displays as a flat list, making it harder to navigate
      large content libraries. This is an optional feature but highly recommended
      for orgs with many presentations.
    category: configuration
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM Topic
        WHERE NetworkId = null
      expect: "count >= 0"
      error_detail_query: >
        SELECT Id, Name, Description
        FROM Topic
        WHERE NetworkId = null
        ORDER BY Name
        LIMIT 10
    symptoms:
      - "Content Library shows flat list of presentations"
      - "Cannot filter presentations by category"
      - "Difficult to find specific content"
    resolution:
      steps:
        - "Navigate to Setup > Topics"
        - "Create topics for organizing presentations (e.g., Cardiology, Oncology, Campaign Q1)"
        - "Navigate to Admin Console > Intelligent Content > Presentations tab"
        - "Edit presentations and assign relevant topics"
        - "Verify topic assignments in Content Library on mobile device"
      ui_path: "Setup > Topics"
    tags: [content, configuration, topics, organization]

  # ===========================================================================
  # SECTION 8: Mobile Metadata Cache for Presentations
  # ===========================================================================

  - id: content-011
    name: Mobile metadata cache active for presentation objects
    description: |
      Verifies that mobile metadata cache is active. Intelligent Content on mobile
      requires an active metadata cache that includes Presentation, PresentationPage,
      PresentationShare, and related objects. Without active cache, presentations
      will not sync to mobile devices and the Content Library will be empty on iPad.
    category: metadata-cache
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciMobileMetadataRecord
        WHERE Status IN ('Active', 'Published')
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Status, IntegrationStatus, LastModifiedDate
        FROM LifeSciMobileMetadataRecord
        ORDER BY LastModifiedDate DESC
        LIMIT 10
    symptoms:
      - "Presentations not syncing to mobile"
      - "Content Library empty on iPad"
      - "Device sync transaction record was not found"
      - "Presentation player not loading"
    resolution:
      steps:
        - "Navigate to Admin Console > Mobile > Object Metadata Cache Configuration"
        - "Verify DB Schema enabled for: Presentation, PresentationPage, PresentationPageContent, PresentationShare, PresentationPageProduct, Topic, LifeSciPresEvent"
        - "Regenerate metadata cache for affected profiles"
        - "Use generate_mobile_metadata_cache({ profileNames: [...] })"
        - "Verify with check_mobile_cache_status()"
        - "Have users sync their mobile devices"
      ui_path: "Admin Console > Mobile > Object Metadata Cache Configuration"
    tags: [content, mobile, cache]

  # ===========================================================================
  # SECTION 9: Presentation Settings Configuration
  # ===========================================================================

  - id: content-012
    name: Presentation Settings configured at org level
    description: |
      Checks whether Presentation Settings are configured at the Org level.
      Presentation Settings control features like tracking, search, feedback capture,
      drawing tools, laser pointer, content library organization, and more.
      Settings can be applied at Org, Profile, or User level. This check verifies
      that at least org-level defaults exist. Note that this check uses Tooling API
      and may require additional permissions.
    category: configuration
    severity: info
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciConfigCategory
        WHERE DeveloperName LIKE '%Presentation%'
      expect: "count >= 0"
      error_detail_query: >
        SELECT DeveloperName, MasterLabel
        FROM LifeSciConfigCategory
        WHERE DeveloperName LIKE '%Presentation%'
    symptoms:
      - "Presentation features not working as expected"
      - "Search not finding presentations"
      - "Drawing tools or laser pointer not available"
      - "Tracking not capturing data"
    resolution:
      steps:
        - "Navigate to Admin Console > Intelligent Content > Presentation Settings"
        - "Configure settings at Org/Profile/User level"
        - "Enable required features: tracking, search, feedback, drawing tools, laser pointer"
        - "Set Presentation Search Field for advanced search"
        - "Configure Targeted Presentations (Warn or Restriction Context)"
        - "Enable 'Create Custom Presentations' if needed"
      ui_path: "Admin Console > Intelligent Content > Presentation Settings"
    tags: [content, configuration, settings]

# ===========================================================================
# Validation Groups
# ===========================================================================
# Groups define which rules to run together for specific scenarios

groups:
  intelligent-content-config-check:
    name: "Intelligent Content Configuration Check"
    description: "Full intelligent content configuration check - presentations, pages, distribution, products, topics, tracking, cache, and settings"
    rules:
      - content-001
      - content-002
      - content-003
      - content-004
      - content-005
      - content-007
      - content-008
      - content-009
      - content-010
      - content-011
      - content-012

  content-presentations:
    name: "Presentation Check"
    description: "Core presentation configuration - presentations, pages, and product assignments"
    rules:
      - content-001
      - content-002
      - content-003
      - content-004
      - content-007

  content-distribution:
    name: "Presentation Distribution Check"
    description: "Territory distribution and access control"
    rules:
      - content-005

  content-mobile:
    name: "Content Mobile Check"
    description: "Mobile-specific content checks - metadata cache and sync requirements"
    rules:
      - content-011

  pre-deployment-content:
    name: "Pre-Deployment Content Check"
    description: "Run before deploying intelligent content to users - all critical checks"
    rules:
      - content-001
      - content-002
      - content-003
      - content-005
      - content-011
      - content-012
