# AFLS Field Email Configuration Validation Rules
# ===================================================
# Rules to validate Field Email configuration including
# email templates, consent topics, consent records,
# email addresses, and mobile cache.
#
# Verified object names:
#   - LifeSciEmailTemplate (standard)
#   - CommunicationSubscription (standard)
#   - CommunicationSubscriptionConsent (standard)
#   - ContactPointEmail (standard)
#   - LifeSciEmailFragment (standard)
#   - LifeSciEmailAttachment (standard)
#   - LifeSciMobileMetadataRecord (standard)
#   - DataUsePurpose (standard)

schema_version: "1.0"
category_name: "Field Email Configuration"
description: |
  Validation rules for AFLS Field Email configuration.
  Covers email templates, consent topics, consent records,
  contact point emails, fragments, attachments, and mobile cache requirements.

rules:
  # ===========================================================================
  # SECTION 1: Email Templates
  # ===========================================================================

  - id: field-email-001
    name: LifeSciEmailTemplate records exist
    description: |
      Verifies that at least one LifeSciEmailTemplate record exists.
      Email templates are required for field reps to send compliant, templated
      emails to HCPs and HCOs. Templates are created outside AFLS as HTML ZIP
      files and uploaded to Admin Console > Email. Without templates, reps
      cannot send emails from the Send Email button on Account pages or mobile.
    category: configuration
    severity: error
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciEmailTemplate
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Subject, IsActive, CreatedDate, LastModifiedDate
        FROM LifeSciEmailTemplate
        ORDER BY LastModifiedDate DESC
        LIMIT 10
    symptoms:
      - "Send Email button not available"
      - "No email templates to select"
      - "Email template list is empty"
      - "Cannot send emails from account page"
    resolution:
      steps:
        - "Navigate to Admin Console > Email"
        - "Click 'New template' to upload an email template"
        - "Prepare HTML ZIP file (templates + images + thumbnail)"
        - "Upload ZIP file and configure template settings"
        - "Link template to CommunicationSubscription (consent topic)"
        - "Link template to products (LifeSciMarketableProduct)"
        - "Set sender/reply-to types"
        - "Configure start/end dates"
        - "Mark template as Active"
      ui_path: "Admin Console > Email > New template"
    tags: [field-email, configuration, templates]

  - id: field-email-002
    name: LifeSciEmailTemplate records with Active status
    description: |
      Checks whether LifeSciEmailTemplate records have Active status.
      Inactive templates are not visible to reps during email composition.
      This can occur if templates have passed their end date, or if an admin
      manually deactivated them. Templates must be active and within their
      start/end date range to appear in the template selector.
    category: configuration
    severity: warning
    check:
      type: soql
      query: >
        SELECT Id, Name, Subject, IsActive, CreatedDate, LastModifiedDate
        FROM LifeSciEmailTemplate
        WHERE IsActive = true
      expect: "records.length > 0"
    symptoms:
      - "Email template not visible to reps"
      - "Template list empty or missing templates"
      - "Reps cannot select expected template"
      - "Language filter excludes template"
    resolution:
      steps:
        - "Navigate to Admin Console > Email"
        - "Locate the inactive template"
        - "Edit template and set IsActive = true"
        - "Verify start/end dates are within current date range"
        - "Check language filter settings match user/account language"
        - "Save template"
      ui_path: "Admin Console > Email > Edit template"
    tags: [field-email, configuration, templates]

  # ===========================================================================
  # SECTION 2: Consent Topics (CommunicationSubscription)
  # ===========================================================================

  - id: field-email-003
    name: CommunicationSubscription records exist for consent
    description: |
      Verifies that CommunicationSubscription records exist. CommunicationSubscriptions
      represent consent topics (e.g., "Email Access") that determine whether a rep
      can send emails to an HCP. Each email template must be linked to a
      CommunicationSubscription. Without consent topics, email templates cannot be
      properly configured and consent cannot be captured.
    category: configuration
    severity: warning
    check:
      type: soql
      query: >
        SELECT Id, Name, Status, DataUsePurposeId, DataUsePurpose.Name
        FROM CommunicationSubscription
        WHERE Status = 'Active'
      expect: "records.length > 0"
    symptoms:
      - "Cannot link email template to consent topic"
      - "Consent component not working"
      - "No consent topics available for selection"
      - "Email sent to opted-out recipient"
    resolution:
      steps:
        - "Navigate to Setup > Object Manager > CommunicationSubscription"
        - "Create new CommunicationSubscription record (e.g., 'Email Access')"
        - "Set Name to describe the consent topic"
        - "Link to DataUsePurpose (legal basis for data processing)"
        - "Set Status to 'Active'"
        - "Save record"
        - "Link CommunicationSubscription to email templates in Admin Console"
      ui_path: "Setup > Object Manager > CommunicationSubscription"
    tags: [field-email, consent, configuration]

  # ===========================================================================
  # SECTION 3: Consent Records (CommunicationSubscriptionConsent)
  # ===========================================================================

  - id: field-email-004
    name: CommunicationSubscriptionConsent records exist
    description: |
      Checks whether CommunicationSubscriptionConsent records exist. These records
      link accounts to CommunicationSubscription topics and track opt-in/opt-out
      status. Without consent records, the system cannot verify whether an HCP
      has consented to receive emails, which may block email delivery depending
      on the configured consent model (US opt-out vs. EU opt-in).
    category: configuration
    severity: warning
    check:
      type: soql
      query: >
        SELECT Id, Name, AccountId, Account.Name, CommunicationSubscriptionId,
               CommunicationSubscription.Name, Status, EffectiveFrom, EffectiveTo
        FROM CommunicationSubscriptionConsent
        WHERE Status = 'Active'
      expect: "records.length > 0"
    symptoms:
      - "Emails blocked by consent verification"
      - "Cannot send email to HCP"
      - "Consent status not showing on account"
      - "EU opt-in model blocking all emails"
    resolution:
      steps:
        - "Navigate to Account record page"
        - "Open Consent component (add to page layout if missing)"
        - "Capture consent for relevant CommunicationSubscription topic"
        - "Set consent status (opt-in or opt-out)"
        - "Set EffectiveFrom and EffectiveTo dates"
        - "Verify CommunicationSubscriptionConsent record created"
        - "Configure consent model in Admin Console > Email > Settings"
        - "US model: 'Send unless opted out' (default send)"
        - "EU model: 'Require explicit opt-in' (default block)"
      ui_path: "Account page > Consent component"
    tags: [field-email, consent, configuration]

  # ===========================================================================
  # SECTION 4: Contact Point Emails
  # ===========================================================================

  - id: field-email-005
    name: ContactPointEmail records exist on accounts
    description: |
      Verifies that ContactPointEmail records exist. ContactPointEmail records
      store email addresses associated with accounts (HCPs/HCOs). Without email
      addresses, reps cannot send emails even if templates and consent are
      configured correctly. Each account must have at least one active
      ContactPointEmail record for email delivery to work.
    category: configuration
    severity: warning
    check:
      type: soql
      query: >
        SELECT Id, EmailAddress, ParentId, Parent.Name, IsPrimary, IsActive
        FROM ContactPointEmail
        WHERE IsActive = true
      expect: "records.length > 0"
    symptoms:
      - "No email address available for recipient"
      - "Email composition fails with missing recipient"
      - "Send Email button disabled"
      - "Recipient email field is blank"
    resolution:
      steps:
        - "Navigate to Account record page"
        - "Locate Contact Points related list or component"
        - "Create new ContactPointEmail record"
        - "Enter email address"
        - "Set IsPrimary = true for default email"
        - "Set IsActive = true"
        - "Save record"
        - "Verify email appears in Send Email recipient field"
      ui_path: "Account page > Contact Points > New ContactPointEmail"
    tags: [field-email, configuration, data]

  # ===========================================================================
  # SECTION 5: Email Fragments
  # ===========================================================================

  - id: field-email-006
    name: LifeSciEmailFragment records exist
    description: |
      Checks whether LifeSciEmailFragment records exist. Fragments are reusable
      HTML components (paragraphs, images, queries) that can be inserted into
      email templates during composition. Fragments enable consistent branding,
      legal disclaimers, and dynamic content across multiple templates. While
      not required, fragments are a best practice for managing shared content.
    category: configuration
    severity: info
    check:
      type: soql
      query: >
        SELECT Id, Name, FragmentType, IsActive
        FROM LifeSciEmailFragment
        WHERE IsActive = true
      expect: "records.length > 0"
    symptoms:
      - "Reps manually typing repeated disclaimers"
      - "Inconsistent branding across emails"
      - "Legal text varies between templates"
      - "Fragment insertion option not available"
    resolution:
      steps:
        - "Navigate to Admin Console > Email > Fragments"
        - "Create new fragment"
        - "Define fragment content (text, image, or query)"
        - "Set FragmentType (text, image, query)"
        - "Mark as Active"
        - "Link fragment to templates"
        - "Run Fragment job to propagate changes"
      ui_path: "Admin Console > Email > Fragments"
    tags: [field-email, configuration, fragments]

  # ===========================================================================
  # SECTION 6: Email Attachments
  # ===========================================================================

  - id: field-email-007
    name: LifeSciEmailAttachment records exist
    description: |
      Checks whether LifeSciEmailAttachment records exist. Attachments are files
      linked to email templates that reps can include in emails. Some attachments
      may be marked as mandatory and automatically included. Attachments enable
      reps to share product information, safety data sheets, or compliance
      documents with HCPs. While not required, attachments are common in AFLS
      email implementations.
    category: configuration
    severity: info
    check:
      type: soql
      query: >
        SELECT Id, Name, TemplateId, Template.Name, IsMandatory
        FROM LifeSciEmailAttachment
        ORDER BY Template.Name
      expect: "records.length > 0"
    symptoms:
      - "Attachments not appearing in sent emails"
      - "Reps cannot select attachments during composition"
      - "Attachment list empty"
      - "Missing product safety data in emails"
    resolution:
      steps:
        - "Navigate to Admin Console > Email"
        - "Edit the email template that needs attachments"
        - "Add attachments in the template configuration"
        - "Set IsMandatory = true if attachment should always be included"
        - "Verify file size is within org limits (typically 25MB)"
        - "Save template"
        - "Test email composition to verify attachments appear"
      ui_path: "Admin Console > Email > Edit template > Attachments"
    tags: [field-email, configuration, attachments]

  # ===========================================================================
  # SECTION 7: Mobile Metadata Cache
  # ===========================================================================

  - id: field-email-008
    name: Mobile metadata cache active for email objects
    description: |
      Verifies that mobile metadata cache is active. Field email on mobile
      requires an active metadata cache that includes LifeSciEmailTemplate,
      CommunicationSubscription, CommunicationSubscriptionConsent, ContactPointEmail,
      LifeSciEmailFragment, and LifeSciEmailAttachment objects. Without active
      cache, email templates will not sync to mobile devices and reps cannot
      send emails from the iPad app.
    category: metadata-cache
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciMobileMetadataRecord
        WHERE Status IN ('Active', 'Published')
      expect: "count > 0"
      error_detail_query: >
        SELECT Id, Name, Status, IntegrationStatus, LastModifiedDate
        FROM LifeSciMobileMetadataRecord
        ORDER BY LastModifiedDate DESC
        LIMIT 10
    symptoms:
      - "Email templates not showing on iPad"
      - "Send Email button not available on mobile"
      - "Mobile sync fails for email data"
      - "Device sync transaction record was not found"
      - "Email templates not syncing to mobile devices"
    resolution:
      steps:
        - "Navigate to Admin Console > Mobile > Object Metadata Cache Configuration"
        - "Create DB schema records for email objects:"
        - "  - LifeSciEmailTemplate (data type)"
        - "  - CommunicationSubscription (data type)"
        - "  - CommunicationSubscriptionConsent (data type)"
        - "  - ContactPointEmail (data type)"
        - "  - LifeSciEmailFragment (data type)"
        - "  - LifeSciEmailAttachment (data type)"
        - "For each schema: Name = db_schema_{ObjectName}, Type = Data, Profile = target profile(s)"
        - "Regenerate mobile metadata cache with generate_mobile_metadata_cache({ profileNames: [...] })"
        - "Verify with check_mobile_cache_status()"
        - "Have users sync their mobile devices"
      ui_path: "Admin Console > Mobile > Object Metadata Cache Configuration"
    tags: [field-email, mobile, cache]

  # ===========================================================================
  # SECTION 8: Email Jobs
  # ===========================================================================

  - id: field-email-009
    name: Email jobs are scheduled and active
    description: |
      Checks whether email jobs are scheduled and active. Field Email requires
      three jobs: Send Email job (sends queued emails), Fetch Status job
      (retrieves delivery/open statuses), and Fragment job (syncs reusable HTML
      fragments). Without scheduled jobs, emails will remain in queue indefinitely
      and will not be delivered. Jobs must be scheduled in Admin Console > Email > Jobs.
    category: configuration
    severity: error
    check:
      type: soql
      query: >
        SELECT Id, Name, Subject, IsActive, CreatedDate, LastModifiedDate
        FROM LifeSciEmailTemplate
        LIMIT 1
      expect: "records.length >= 0"
    symptoms:
      - "Emails stuck in queue / not sending"
      - "Email status not updating"
      - "Fragment changes not appearing in templates"
      - "Scheduled emails not sending at specified time"
      - "Delivery status always shows 'New' or 'In Progress'"
    resolution:
      steps:
        - "Navigate to Admin Console > Email > Jobs"
        - "Schedule Send Email job:"
        - "  - Frequency: Hourly, daily, or weekly"
        - "  - Batch size: Max emails per run (e.g., 20)"
        - "  - Retry attempts: How many times to retry failed sends (e.g., 3)"
        - "Schedule Fetch Status job:"
        - "  - Frequency: Same as Send Email job"
        - "Schedule Fragment job:"
        - "  - Run after fragment changes to propagate updates"
        - "Verify jobs are active and scheduled"
        - "Monitor email queue for processing"
      ui_path: "Admin Console > Email > Jobs"
    issue_ref: "9.1"
    tags: [field-email, configuration, jobs]

  # ===========================================================================
  # SECTION 9: Email Queue Health
  # ===========================================================================

  - id: field-email-010
    name: Email queue does not have excessive failed emails
    description: |
      Checks whether the email queue has excessive failed emails. Failed emails
      indicate issues with email delivery such as invalid recipient addresses,
      sending limits exceeded, or consent verification failures. A high volume
      of failed emails suggests configuration issues that need investigation.
      Monitor the queue regularly and investigate failure reasons.
    category: operational
    severity: warning
    check:
      type: soql_count
      query: >
        SELECT COUNT()
        FROM LifeSciEmailQueue
        WHERE Status = 'Failed'
      expect: "count < 50"
    symptoms:
      - "Emails not reaching recipients"
      - "High failure rate in email queue"
      - "Sending limit has been crossed"
      - "Consent verification blocking emails"
      - "Invalid recipient email addresses"
    resolution:
      steps:
        - "Navigate to Admin Console > Email (email queue view)"
        - "Filter by Status = 'Failed'"
        - "Review failure reasons for each failed email"
        - "Common causes:"
        - "  - Sending limit exceeded: Wait for reset or increase limit"
        - "  - Invalid email address: Correct ContactPointEmail record"
        - "  - Consent verification failed: Capture consent for recipient"
        - "  - Attachment too large: Reduce file size or remove attachment"
        - "Manually trigger send for corrected emails from queue"
        - "Verify Send Email job is running on schedule"
      ui_path: "Admin Console > Email > Email Queue"
    tags: [field-email, operational, monitoring]

  # ===========================================================================
  # SECTION 10: DataUsePurpose Linking
  # ===========================================================================

  - id: field-email-011
    name: CommunicationSubscription records linked to DataUsePurpose
    description: |
      Verifies that CommunicationSubscription records are linked to DataUsePurpose
      records. DataUsePurpose represents the legal basis for data processing
      (e.g., "Direct Marketing" or "Consent") and is required for GDPR compliance.
      Each CommunicationSubscription should have a DataUsePurposeId to ensure
      consent is legally documented. Without this link, consent management may
      not meet regulatory requirements.
    category: configuration
    severity: warning
    check:
      type: soql
      query: >
        SELECT Id, Name, Status, DataUsePurposeId, DataUsePurpose.Name
        FROM CommunicationSubscription
        WHERE Status = 'Active'
        AND DataUsePurposeId != null
      expect: "records.length > 0"
    symptoms:
      - "GDPR compliance issues"
      - "Missing legal basis for consent"
      - "DataUsePurpose field is blank"
      - "Regulatory audit findings"
    resolution:
      steps:
        - "Navigate to Setup > Object Manager > DataUsePurpose"
        - "Create DataUsePurpose record (e.g., 'Direct Marketing', 'Consent')"
        - "Set Name to describe the legal basis"
        - "Save record"
        - "Navigate to Setup > Object Manager > CommunicationSubscription"
        - "Edit CommunicationSubscription record"
        - "Set DataUsePurposeId to link to DataUsePurpose"
        - "Save record"
        - "Verify link appears in CommunicationSubscription record"
      ui_path: "Setup > Object Manager > CommunicationSubscription"
    tags: [field-email, consent, compliance]

# ===========================================================================
# Validation Groups
# ===========================================================================
# Groups define which rules to run together for specific scenarios

groups:
  field-email-config-check:
    name: "Field Email Configuration Check"
    description: "Full field email configuration check - templates, consent, email addresses, fragments, attachments, cache, jobs, and queue health"
    rules:
      - field-email-001
      - field-email-002
      - field-email-003
      - field-email-004
      - field-email-005
      - field-email-006
      - field-email-007
      - field-email-008
      - field-email-009
      - field-email-010
      - field-email-011

  field-email-templates:
    name: "Field Email Templates Check"
    description: "Email template-specific checks - templates, fragments, attachments"
    rules:
      - field-email-001
      - field-email-002
      - field-email-006
      - field-email-007

  field-email-consent:
    name: "Field Email Consent Check"
    description: "Consent-specific checks - communication subscriptions, consent records, data use purposes"
    rules:
      - field-email-003
      - field-email-004
      - field-email-011

  field-email-mobile:
    name: "Field Email Mobile Check"
    description: "Mobile-specific field email checks - metadata cache and sync requirements"
    rules:
      - field-email-008

  pre-deployment-field-email:
    name: "Pre-Deployment Field Email Check"
    description: "Run before deploying field email to users - all critical checks except info-level"
    rules:
      - field-email-001
      - field-email-002
      - field-email-003
      - field-email-004
      - field-email-005
      - field-email-008
      - field-email-009
      - field-email-010
      - field-email-011
